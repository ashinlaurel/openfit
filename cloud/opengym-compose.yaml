name: openfit

services:
  gym-api:
    image: ${GYM_API_IMAGE:?Set a pinned Open Gym API image}
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      RP_ID: ${GYM_HOST:?Set the public Open Gym hostname}
      ORIGIN: https://${GYM_HOST}
      RP_NAME: Open Gym
      FIRST_USER_ADMIN: "1"
      INVITE_ONLY: "1"
      ALLOW_GUEST: "0"
      PASSWORD_LOGIN: "0"
      TRUST_PROXY: "1"
    volumes:
      - ../data/gym:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 256m

  gym-web:
    image: ${GYM_WEB_IMAGE:?Set a pinned Open Gym web image}
    restart: unless-stopped
    environment:
      NGINX_PORT: 80
      BACKEND: gym-api
      PORT: 3000
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ""
      BASE_PATH: ""
      MEDIA_UPLOAD_MAX: 48m
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  openfit-cloud:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3100
      DATA_DIR: /data
      OPEN_GYM_API_URL: http://gym-api:3000
      STORAGE_KEY: ${STORAGE_KEY:?Set the OpenFit storage encryption key}
    volumes:
      - ../data/openfit:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: 192m

  proxy:
    image: ${CADDY_IMAGE:?Set a pinned Caddy image}
    restart: unless-stopped
    user: "1000:1000"
    environment:
      GYM_HOST: ${GYM_HOST}
      OPENFIT_HOST: ${OPENFIT_HOST:?Set the public OpenFit API hostname}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../data/caddy:/data
      - ../data/caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: 128m
